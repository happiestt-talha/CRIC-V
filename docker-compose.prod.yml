# Production Docker Compose — for DigitalOcean
# Run with: docker-compose -f docker-compose.prod.yml up -d --build
# The -d flag runs in background (detached mode)

version: '3.9'

services:

  db:
    image: postgres:15-alpine
    container_name: cricv_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Don't expose port in production — only internal access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cricv_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./cric-v-backend
      dockerfile: Dockerfile.prod
    container_name: cricv_backend
    restart: always
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENVIRONMENT: production
    volumes:
      - cricv_data:/app/data
      - ./cric-v-backend/models:/app/models
      - ./cric-v-backend/pose_landmarker.task:/app/pose_landmarker.task
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        alembic upgrade head &&
        gunicorn app.main:app
        --worker-class uvicorn.workers.UvicornWorker
        --workers 2
        --bind 0.0.0.0:8000
        --timeout 120
      "

  worker:
    build:
      context: ./cric-v-backend
      dockerfile: Dockerfile.prod
    container_name: cricv_worker
    restart: always
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENVIRONMENT: production
    volumes:
      - cricv_data:/app/data
      - ./cric-v-backend/models:/app/models
      - ./cric-v-backend/pose_landmarker.task:/app/pose_landmarker.task
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Production: use prefork (Linux supports it)
    command: celery -A app.workers.tasks worker --loglevel=info --concurrency=2

  frontend:
    build:
      context: ./cric-v-frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: https://cric-v.live/api
        NEXT_PUBLIC_SITE_URL: https://cric-v.live
    container_name: cricv_frontend
    restart: always
    environment:
      NODE_ENV: production

  nginx:
    image: nginx:alpine
    container_name: cricv_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # SSL certificates — mount after getting them from Let's Encrypt
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
    name: cricv_postgres_data_prod
  cricv_data:
    name: cricv_app_data_prod
